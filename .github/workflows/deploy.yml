name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões exigidas pelo deploy-pages (OIDC).
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já está no ar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Montar o site
        # A LP é estática: vai tudo do topo do repositório, menos o que não
        # deve ir ao ar. O glob não pega arquivos ocultos, então .git e
        # .github ficam de fora sozinhos.
        run: |
          mkdir -p _site
          for item in *; do
            case "$item" in
              _site|README.md) continue ;;
            esac
            cp -r "$item" _site/
          done
          touch _site/.nojekyll
          echo "Publicando:" && find _site -type f | sort

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
